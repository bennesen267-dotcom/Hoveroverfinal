          package com.hvh;

          import java.util.ArrayList;
          import java.util.Comparator;
          import java.util.List;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.client.gui.widget.ButtonWidget;
          import net.minecraft.client.gui.widget.TextFieldWidget;
          import net.minecraft.item.Item;
          import net.minecraft.item.ItemStack;
          import net.minecraft.item.Items;
          import net.minecraft.registry.Registries;
          import net.minecraft.text.Text;

          public class WeaponsScreen extends Screen {
              private static final int ROW = 20;
              private final Screen parent;
              private TextFieldWidget search;
              private final List<Item> list = new ArrayList<>();
              private String lastQuery = "";
              private boolean selectedOnly = false;
              private int scroll = 0;

              private boolean pressedList = false;
              private boolean dragged = false;
              private int pressIdx = -1;
              private double dragAcc = 0;

              public WeaponsScreen(Screen parent) {
                  super(Text.literal("Weapons"));
                  this.parent = parent;
              }

              @Override
              protected void init() {
                  search = new TextFieldWidget(this.textRenderer, this.width / 2 - 100, 22, 200, 18, Text.literal("Search"));
                  addDrawableChild(search);

                  int bx = this.width / 2 - 138;
                  addDrawableChild(ButtonWidget.builder(Text.literal("Back"), b -> close())
                          .dimensions(bx, 44, 90, 18).build());
                  addDrawableChild(ButtonWidget.builder(Text.literal("Selected: " + (selectedOnly ? "ON" : "OFF")), b -> {
                      selectedOnly = !selectedOnly;
                      b.setMessage(Text.literal("Selected: " + (selectedOnly ? "ON" : "OFF")));
                      rebuild();
                  }).dimensions(bx + 93, 44, 90, 18).build());
                  addDrawableChild(ButtonWidget.builder(Text.literal("Reset"), b -> {
                      HvhClient.defaultWeapons();
                      rebuild();
                  }).dimensions(bx + 186, 44, 90, 18).build());

                  rebuild();
              }

              private int listTop() {
                  return 68;
              }

              private int visibleRows() {
                  return Math.max(1, (this.height - 6 - listTop()) / ROW);
              }

              private void rebuild() {
                  String q = search == null ? "" : search.getText().toLowerCase().trim();
                  lastQuery = q;
                  list.clear();
                  for (Item it : Registries.ITEM) {
                      if (it == Items.AIR) continue;
                      boolean sel = HvhClient.weapons.contains(it);
                      if (selectedOnly && !sel) continue;
                      if (!q.isEmpty()) {
                          String n = it.getName().getString().toLowerCase();
                          String id = Registries.ITEM.getId(it).getPath();
                          if (!n.contains(q) && !id.contains(q)) continue;
                      }
                      list.add(it);
                  }
                  list.sort(Comparator.comparing((Item i) -> !HvhClient.weapons.contains(i)));
                  scroll = 0;
              }

              private void clampScroll() {
                  int max = Math.max(0, list.size() - visibleRows());
                  if (scroll > max) scroll = max;
                  if (scroll < 0) scroll = 0;
              }

              @Override
              public void render(DrawContext ctx, int mx, int my, float delta) {
                  renderBackground(ctx);
                  ctx.drawCenteredTextWithShadow(this.textRenderer, "Weapons (" + HvhClient.weapons.size() + " selected) - tap to toggle", this.width / 2, 8, 0xFFFFFFFF);

                  String q = search.getText().toLowerCase().trim();
                  if (!q.equals(lastQuery)) rebuild();
                  clampScroll();

                  int x = this.width / 2 - 140;
                  int w = 280;
                  int top = listTop();
                  int rows = visibleRows();
                  for (int i = 0; i < rows; i++) {
                      int idx = scroll + i;
                      if (idx >= list.size()) break;
                      Item it = list.get(idx);
                      int y = top + i * ROW;
                      boolean sel = HvhClient.weapons.contains(it);
                      ctx.fill(x, y, x + w, y + ROW - 2, sel ? 0xFF245A3A : 0xFF2A2A34);
                      ctx.drawItem(new ItemStack(it), x + 2, y + 1);
                      ctx.drawTextWithShadow(this.textRenderer, it.getName().getString(), x + 24, y + 5, 0xFFFFFFFF);
                      ctx.drawTextWithShadow(this.textRenderer, sel ? "WEAPON" : "-", x + w - 48, y + 5, sel ? 0xFF55FF55 : 0xFF888888);
                  }

                  super.render(ctx, mx, my, delta);

                  if (search.getText().isEmpty() && !search.isFocused()) {
                      ctx.drawTextWithShadow(this.textRenderer, "Search...", this.width / 2 - 96, 27, 0xFF888888);
                  }
              }

              private boolean inList(double mx, double my) {
                  int x = this.width / 2 - 140;
                  return mx >= x && mx < x + 280 && my >= listTop();
              }

              @Override
              public boolean mouseClicked(double mx, double my, int button) {
                  if (super.mouseClicked(mx, my, button)) return true;
                  if (inList(mx, my)) {
                      int row = (int) ((my - listTop()) / ROW);
                      if (row < visibleRows()) {
                          pressedList = true;
                          dragged = false;
                          dragAcc = 0;
                          pressIdx = row + scroll;
                          return true;
                      }
                  }
                  return false;
              }

              @Override
              public boolean mouseDragged(double mx, double my, int button, double dx, double dy) {
                  if (pressedList) {
                      if (Math.abs(dy) > 0) dragged = true;
                      dragAcc += dy;
                      while (dragAcc <= -ROW) {
                          scroll++;
                          dragAcc += ROW;
                      }
                      while (dragAcc >= ROW) {
                          scroll--;
                          dragAcc -= ROW;
                      }
                      clampScroll();
                      return true;
                  }
                  return super.mouseDragged(mx, my, button, dx, dy);
              }

              @Override
              public boolean mouseReleased(double mx, double my, int button) {
                  if (pressedList) {
                      pressedList = false;
                      if (!dragged && pressIdx >= 0 && pressIdx < list.size()) {
                          Item it = list.get(pressIdx);
                          if (!HvhClient.weapons.remove(it)) HvhClient.weapons.add(it);
                      }
                      return true;
                  }
                  return super.mouseReleased(mx, my, button);
              }

              @Override
              public boolean mouseScrolled(double mx, double my, double amount) {
                  scroll -= (int) Math.signum(amount) * 3;
                  clampScroll();
                  return true;
              }

              @Override
              public void close() {
                  this.client.setScreen(parent);
              }

              @Override
              public void removed() {
                  HvhClient.save();
              }
          }
