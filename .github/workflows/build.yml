                  ctx.fill(x + w - 18, y, x + w, y + ROW - 2, 0xFF7A2A2A);
                  ctx.drawTextWithShadow(this.textRenderer, "x", x + w - 12, y + 5, 0xFFFFFFFF);
              }

              @Override
              protected void tapRow(int idx, double mx, int rowX) {
                  if (mx < rowX + 72) {
                      listening = (listening == idx) ? -1 : idx;
                  } else if (mx >= rowX + listW() - 18) {
                      Macros.list.remove(idx);
                      listening = -1;
                      HvhClient.save();
                  }
              }

              @Override
              public void render(DrawContext ctx, int mx, int my, float delta) {
                  renderBackground(ctx);
                  ctx.drawCenteredTextWithShadow(this.textRenderer, "Macros (" + Macros.list.size() + ") - tap key box to bind, x = delete", this.width / 2, 8, 0xFFFFFFFF);
