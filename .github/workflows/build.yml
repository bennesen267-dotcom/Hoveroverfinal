          package com.hvh;

          import java.util.ArrayList;
          import java.util.Comparator;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Map;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.client.gui.widget.ButtonWidget;
          import net.minecraft.client.network.ClientPlayNetworkHandler;
          import net.minecraft.client.network.PlayerListEntry;
          import net.minecraft.text.Text;
          import org.lwjgl.glfw.GLFW;

          public class FriendsScreen extends ListScreen {
              private final List<String[]> rows = new ArrayList<>();

              public FriendsScreen(Screen parent) {
                  super("Friends", parent);
              }

              @Override
              protected void init() {
                  makeField(32, "search / type a name");
                  int bx = this.width / 2 - 140;
                  addDrawableChild(ButtonWidget.builder(Text.literal("Back"), b -> close())
                          .dimensions(bx, 44, 136, 18).build());
                  addDrawableChild(ButtonWidget.builder(Text.literal("Add typed name"), b -> addTyped())
                          .dimensions(bx + 144, 44, 136, 18).build());
                  rebuild();
              }

              private void addTyped() {
                  String n = field.getText().trim().toLowerCase().replace(" ", "");
                  if (n.isEmpty()) return;
                  Friends.set.add(n);
                  field.setText("");
                  HvhClient.save();
              }

              private void rebuild() {
                  String q = field == null ? "" : field.getText().toLowerCase().trim();
                  Map<String, String> map = new LinkedHashMap<>();
                  ClientPlayNetworkHandler nh = this.client == null ? null : this.client.getNetworkHandler();
                  if (nh != null) {
                      for (PlayerListEntry e : nh.getPlayerList()) {
                          String n = e.getProfile().getName();
                          map.put(n.toLowerCase(), n);
                      }
                  }
                  for (String f : Friends.set) map.putIfAbsent(f, f);
                  rows.clear();
                  for (Map.Entry<String, String> en : map.entrySet()) {
                      if (!q.isEmpty() && !en.getKey().contains(q)) continue;
                      rows.add(new String[] { en.getKey(), en.getValue() });
                  }
                  rows.sort(Comparator.comparing((String[] r) -> !Friends.set.contains(r[0])).thenComparing(r -> r[0]));
              }

              @Override
              protected int count() {
                  return rows.size();
              }

              @Override
              protected void drawRow(DrawContext ctx, int idx, int x, int y, int w) {
                  String[] r = rows.get(idx);
                  boolean fr = Friends.set.contains(r[0]);
                  ctx.fill(x, y, x + w, y + ROW - 2, fr ? 0xFF245A3A : 0xFF2A2A34);
                  ctx.drawTextWithShadow(this.textRenderer, r[1], x + 6, y + 5, 0xFFFFFFFF);
                  ctx.drawTextWithShadow(this.textRenderer, fr ? "FRIEND" : "-", x + w - 48, y + 5, fr ? 0xFF55FF55 : 0xFF888888);
              }

              @Override
              protected void tapRow(int idx, double mx, int rowX) {
                  String key = rows.get(idx)[0];
                  if (!Friends.set.remove(key)) Friends.set.add(key);
                  HvhClient.save();
              }

              @Override
              public void render(DrawContext ctx, int mx, int my, float delta) {
                  renderBackground(ctx);
                  rebuild();
                  ctx.drawCenteredTextWithShadow(this.textRenderer, "Friends (" + Friends.set.size() + ") - tap a name to toggle", this.width / 2, 8, 0xFFFFFFFF);
                  drawList(ctx);
                  super.render(ctx, mx, my, delta);
              }

              @Override
              public boolean keyPressed(int key, int scan, int modifiers) {
                  if ((key == GLFW.GLFW_KEY_ENTER || key == GLFW.GLFW_KEY_KP_ENTER) && field.isFocused()) {
                      addTyped();
                      return true;
                  }
                  return super.keyPressed(key, scan, modifiers);
              }
          }
