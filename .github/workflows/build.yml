          cat > src/main/java/com/hvh/HvhClient.java <<'EOF'
          package com.hvh;

          import java.io.InputStream;
          import java.io.OutputStream;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Map;
          import java.util.Properties;
          import java.util.Set;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.rendering.v1.HudRenderCallback;
          import net.fabricmc.fabric.api.client.rendering.v1.WorldRenderEvents;
          import net.fabricmc.loader.api.FabricLoader;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.util.InputUtil;
          import net.minecraft.item.AxeItem;
          import net.minecraft.item.Item;
          import net.minecraft.item.SwordItem;
          import net.minecraft.registry.Registries;
          import net.minecraft.util.Identifier;
          import org.lwjgl.glfw.GLFW;

          public class HvhClient implements ClientModInitializer {
              public static final List<Mod> mods = new ArrayList<>();
              public static final Set<Item> weapons = new HashSet<>();
              public static final Map<Integer, Boolean> prev = new HashMap<>();
              private static final Map<Integer, Boolean> cur = new HashMap<>();
              public static int guiKey = GLFW.GLFW_KEY_RIGHT_SHIFT;
              private static long lastNano = System.nanoTime();

              @Override
              public void onInitializeClient() {
                  mods.add(new TriggerBot());
                  mods.add(new AimAssist());
                  mods.add(new HoverTotem());
                  mods.add(new Nametags());
                  mods.add(new Hud());
                  mods.add(new ViewModel());
                  mods.add(new Macros());
                  mods.add(new Friends());
                  mods.add(new ConfigMod());
                  defaultWeapons();
                  load();

                  ClientTickEvents.END_CLIENT_TICK.register(HvhClient::tick);
                  WorldRenderEvents.START.register(ctx -> frame());
                  WorldRenderEvents.AFTER_ENTITIES.register(ctx -> {
                      for (Mod m : mods) {
                          if (m.enabled) m.onRender(ctx);
                      }
                  });
                  HudRenderCallback.EVENT.register((ctx, tickDelta) -> {
                      MinecraftClient mc = MinecraftClient.getInstance();
                      if (mc.options.hudHidden) return;
                      for (Mod m : mods) {
                          if (m.enabled) m.onHud(ctx);
                      }
                  });
              }

              public static <T extends Mod> T get(Class<T> c) {
                  for (Mod m : mods) {
                      if (c.isInstance(m)) return c.cast(m);
                  }
                  return null;
              }

              public static void defaultWeapons() {
                  weapons.clear();
                  for (Item i : Registries.ITEM) {
                      if (i instanceof SwordItem || i instanceof AxeItem) weapons.add(i);
                  }
              }

              private static void tick(MinecraftClient mc) {
                  if (mc.getWindow() == null) return;
                  long w = mc.getWindow().getHandle();

                  boolean gui = edge(w, guiKey);
                  if (gui && mc.currentScreen == null && mc.player != null) {
                      mc.setScreen(new ClickGui());
                  }

                  for (Mod m : mods) {
                      if (m.toggleable) {
                          boolean e = edge(w, m.bind);
                          if (e && mc.currentScreen == null && mc.player != null) {
                              m.toggle();
                              save();
                          }
                      }
                      if (m.enabled) m.onTick(mc);
                  }

                  prev.putAll(cur);
                  cur.clear();
              }

              private static void frame() {
                  long now = System.nanoTime();
                  float dt = Math.min(0.1f, (now - lastNano) / 1_000_000_000f);
                  lastNano = now;
                  MinecraftClient mc = MinecraftClient.getInstance();
                  for (Mod m : mods) {
                      if (m.enabled) m.onFrame(mc, dt);
                  }
              }

              public static boolean edge(long window, int key) {
                  if (key < 0) return false;
                  boolean now = InputUtil.isKeyPressed(window, key);
                  boolean was = prev.getOrDefault(key, false);
                  cur.put(key, now);
                  return now && !was;
              }

              public static String keyName(int key) {
                  if (key < 0) return "None";
                  return InputUtil.fromKeyCode(key, 0).getLocalizedText().getString();
              }

              private static Path cfgPath() {
                  return FabricLoader.getInstance().getConfigDir().resolve("hvhclient.properties");
              }

              public static Properties buildProps() {
                  Properties p = new Properties();
                  for (Mod m : mods) {
                      p.setProperty(m.name + ".enabled", String.valueOf(m.enabled));
                      p.setProperty(m.name + ".bind", String.valueOf(m.bind));
                      for (Setting s : m.settings) {
                          if (s instanceof Setting.Bool b) {
                              p.setProperty(m.name + "." + s.name, String.valueOf(b.value));
                          } else if (s instanceof Setting.Num n) {
                              p.setProperty(m.name + "." + s.name, String.valueOf(n.value));
                          }
                      }
                  }
                  StringBuilder sb = new StringBuilder();
                  for (Item i : weapons) {
                      if (sb.length() > 0) sb.append(',');
                      sb.append(Registries.ITEM.getId(i).toString());
                  }
                  p.setProperty("weapons", sb.toString());
                  p.setProperty("friends", String.join(",", Friends.set));
                  p.setProperty("macros.count", String.valueOf(Macros.list.size()));
                  for (int i = 0; i < Macros.list.size(); i++) {
                      Macros.Macro mc = Macros.list.get(i);
                      p.setProperty("macro." + i + ".cmd", mc.cmd);
                      p.setProperty("macro." + i + ".key", String.valueOf(mc.key));
                  }
                  return p;
              }

              public static void applyProps(Properties p) {
                  for (Mod m : mods) {
                      String en = p.getProperty(m.name + ".enabled");
                      if (en != null) m.enabled = Boolean.parseBoolean(en);
                      String bd = p.getProperty(m.name + ".bind");
                      if (bd != null) {
                          try {
                              m.bind = Integer.parseInt(bd);
                          } catch (Exception ignored) {
                          }
                      }
                      for (Setting s : m.settings) {
                          String v = p.getProperty(m.name + "." + s.name);
                          if (v == null) continue;
                          try {
                              if (s instanceof Setting.Bool b) {
                                  b.value = Boolean.parseBoolean(v);
                              } else if (s instanceof Setting.Num n) {
                                  n.value = Double.parseDouble(v);
                              }
                          } catch (Exception ignored) {
                          }
                      }
                  }

                  String w = p.getProperty("weapons");
                  if (w != null) {
                      weapons.clear();
                      for (String id : w.split(",")) {
                          if (id.isEmpty()) continue;
                          Identifier ident = Identifier.tryParse(id);
                          if (ident != null && Registries.ITEM.containsId(ident)) {
                              weapons.add(Registries.ITEM.get(ident));
                          }
                      }
                  }

                  String fr = p.getProperty("friends");
                  if (fr != null) {
                      Friends.set.clear();
                      for (String f : fr.split(",")) {
                          if (!f.trim().isEmpty()) Friends.set.add(f.trim().toLowerCase());
                      }
                  }

                  String cnt = p.getProperty("macros.count");
                  if (cnt != null) {
                      Macros.list.clear();
                      try {
                          int n = Integer.parseInt(cnt);
                          for (int i = 0; i < n; i++) {
                              String cmd = p.getProperty("macro." + i + ".cmd");
                              if (cmd == null) continue;
                              int key = Integer.parseInt(p.getProperty("macro." + i + ".key", "-1"));
                              Macros.list.add(new Macros.Macro(cmd, key));
                          }
                      } catch (Exception ignored) {
                      }
                  }
              }

              public static void save() {
                  try (OutputStream o = Files.newOutputStream(cfgPath())) {
                      buildProps().store(o, "HVH Client");
                  } catch (Exception ignored) {
                  }
              }

              private static void load() {
                  Path f = cfgPath();
                  if (!Files.exists(f)) return;
                  try (InputStream in = Files.newInputStream(f)) {
                      Properties p = new Properties();
                      p.load(in);
                      applyProps(p);
                  } catch (Exception ignored) {
                  }
              }
          }
          EOF

          cat > src/main/java/com/hvh/ClickGui.java <<'EOF'
          package com.hvh;

          import java.util.ArrayList;
          import java.util.List;
          import net.minecraft.client.font.TextRenderer;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.text.Text;
          import org.lwjgl.glfw.GLFW;

          public class ClickGui extends Screen {
              private static final int W = 150, ROW = 14, HEAD = 16, GAP = 6, TOP = 10, LEFT = 8;
              private static final String[] CATS = {"Combat", "Render", "Misc"};
              private static final int K_CAT = 0, K_PANEL = 1, K_HEAD = 2, K_SET = 3, K_BIND = 4;

              private static class Cell {
                  int kind, x, y, w, h;
                  Mod mod;
                  Setting s;
                  String text;
              }

              private final List<Cell> cells = new ArrayList<>();
              private Mod listening = null;
              private int scrollX = 0, scrollY = 0, contentW = 0, contentH = 0;
              private Runnable pending = null;
              private boolean scrolling = false, moved = false;
              private double pressX, pressY;
              private Setting.Num slider = null;
              private int sliderX = 0;

              public ClickGui() {
                  super(Text.literal("HVH Client"));
              }

              @Override
              public boolean shouldPause() {
                  return false;
              }

              private Cell cell(int kind, int x, int y, int w, int h, Mod m, Setting s) {
                  Cell c = new Cell();
                  c.kind = kind;
                  c.x = x;
                  c.y = y;
                  c.w = w;
                  c.h = h;
                  c.mod = m;
                  c.s = s;
                  return c;
              }

              private void clampScroll() {
                  int minY = Math.min(0, this.height - 24 - contentH);
                  int minX = Math.min(0, this.width - contentW - LEFT);
                  scrollY = Math.max(minY, Math.min(0, scrollY));
                  scrollX = Math.max(minX, Math.min(0, scrollX));
              }

              private void layout() {
                  clampScroll();
                  cells.clear();
                  int x = LEFT + scrollX;
                  int bottom = 0;
                  for (String cat : CATS) {
                      Cell head = cell(K_CAT, x, TOP + scrollY, W, HEAD, null, null);
                      head.text = cat;
                      cells.add(head);
                      int y = TOP + scrollY + HEAD + 2;
                      for (Mod m : HvhClient.mods) {
                          if (!m.category.equals(cat)) continue;
                          int panelIdx = cells.size();
                          cells.add(null);
                          cells.add(cell(K_HEAD, x, y, W, HEAD, m, null));
                          int ry = y + HEAD;
                          if (m.expanded) {
                              for (Setting s : m.settings) {
                                  cells.add(cell(K_SET, x, ry, W, ROW, m, s));
                                  ry += ROW;
                              }
                              if (m.toggleable) {
                                  cells.add(cell(K_BIND, x, ry, W, ROW, m, null));
                                  ry += ROW;
                              }
                          }
                          cells.set(panelIdx, cell(K_PANEL, x, y, W, ry - y + 2, m, null));
                          y = ry + 2 + 4;
                      }
                      bottom = Math.max(bottom, y - scrollY);
                      x += W + GAP;
                  }
                  contentW = x - scrollX;
                  contentH = bottom;
              }

              @Override
              public void render(DrawContext ctx, int mx, int my, float delta) {
                  renderBackground(ctx);
                  layout();
                  TextRenderer tr = this.textRenderer;
                  for (Cell c : cells) {
                      if (c.kind == K_CAT) {
                          ctx.fill(c.x, c.y, c.x + c.w, c.y + c.h, 0xFF5A3EA0);
                          ctx.drawCenteredTextWithShadow(tr, c.text, c.x + c.w / 2, c.y + 4, 0xFFFFFFFF);
                      } else if (c.kind == K_PANEL) {
                          ctx.fill(c.x, c.y, c.x + c.w, c.y + c.h, 0xEE101018);
                      } else if (c.kind == K_HEAD) {
                          Mod m = c.mod;
                          int col = !m.toggleable ? 0xFF3A3A6A : (m.enabled ? 0xFF2E8B57 : 0xFF44444F);
                          ctx.fill(c.x, c.y, c.x + c.w, c.y + c.h, col);
                          String label = m.name + (m.toggleable ? (m.enabled ? "  [ON]" : "  [OFF]") : "");
                          ctx.drawTextWithShadow(tr, label, c.x + 4, c.y + 4, 0xFFFFFFFF);
                          ctx.drawTextWithShadow(tr, m.expanded ? "v" : ">", c.x + c.w - 10, c.y + 4, 0xFFDDDDDD);
                      } else if (c.kind == K_SET) {
                          drawSetting(ctx, tr, c.s, c.x, c.y);
                      } else if (c.kind == K_BIND) {
                          boolean l = listening == c.mod;
                          ctx.fill(c.x, c.y, c.x + c.w, c.y + c.h, l ? 0xFF8B6B1E : 0xFF2A2A34);
                          String bt = l ? "Bind: press a key..." : "Bind: " + HvhClient.keyName(c.mod.bind);
                          ctx.drawTextWithShadow(tr, bt, c.x + 4, c.y + 3, 0xFFFFFFFF);
                      }
                  }
                  ctx.drawTextWithShadow(tr, "Tap = toggle | v = fold | drag = scroll | RShift = close", 4, this.height - 12, 0xFFAAAAAA);
              }

              private void drawSetting(DrawContext ctx, TextRenderer tr, Setting s, int x, int y) {
                  if (s instanceof Setting.Bool b) {
                      ctx.fill(x, y, x + W, y + ROW, b.value ? 0xFF245A3A : 0xFF2A2A34);
                      ctx.drawTextWithShadow(tr, s.name, x + 4, y + 3, 0xFFFFFFFF);
                      ctx.drawTextWithShadow(tr, b.value ? "ON" : "OFF", x + W - 22, y + 3, b.value ? 0xFF55FF55 : 0xFFFF5555);
                  } else if (s instanceof Setting.Num n) {
                      ctx.fill(x, y, x + W, y + ROW, 0xFF2A2A34);
                      ctx.fill(x, y, x + (int) ((W - 30) * n.fraction()), y + ROW, 0xFF3B3B7B);
                      String val = n.infiniteTop && n.value >= n.max ? "Infinite" : fmt(n.value);
                      ctx.drawTextWithShadow(tr, s.name + ": " + val, x + 4, y + 3, 0xFFFFFFFF);
                      ctx.fill(x + W - 28, y + 1, x + W - 15, y + ROW - 1, 0xFF55555F);
                      ctx.fill(x + W - 14, y + 1, x + W - 1, y + ROW - 1, 0xFF55555F);
                      ctx.drawTextWithShadow(tr, "-", x + W - 24, y + 3, 0xFFFFFFFF);
                      ctx.drawTextWithShadow(tr, "+", x + W - 10, y + 3, 0xFFFFFFFF);
                  } else {
                      ctx.fill(x, y, x + W, y + ROW, 0xFF3A3A6A);
                      ctx.drawTextWithShadow(tr, s.name + " >", x + 4, y + 3, 0xFFFFFFFF);
                  }
              }

              private String fmt(double v) {
                  if (v == Math.floor(v)) return String.valueOf((int) v);
                  return String.valueOf(Math.round(v * 100.0) / 100.0);
              }

              private boolean in(double mx, double my, int x, int y, int w, int h) {
                  return mx >= x && mx < x + w && my >= y && my < y + h;
              }

              private Runnable actionFor(Cell c, double mx, Mod wasListening) {
                  if (c.kind == K_HEAD) {
                      Mod m = c.mod;
                      if (mx >= c.x + c.w - 16) return () -> m.expanded = !m.expanded;
                      if (m.toggleable) return m::toggle;
                      return () -> m.expanded = !m.expanded;
                  }
                  if (c.kind == K_BIND) {
                      Mod m = c.mod;
                      return () -> listening = (wasListening == m) ? null : m;
                  }
                  if (c.kind == K_SET) {
                      Setting s = c.s;
                      if (s instanceof Setting.Bool b) return () -> b.value = !b.value;
                      if (s instanceof Setting.Num n) {
                          if (mx >= c.x + W - 28 && mx < c.x + W - 14) return () -> n.change(-1);
                          if (mx >= c.x + W - 14) return () -> n.change(1);
                          return null;
                      }
                      if (s instanceof Setting.Button btn) return () -> btn.action.run();
                  }
                  return null;
              }

              @Override
              public boolean mouseClicked(double mx, double my, int button) {
                  layout();
                  pressX = mx;
                  pressY = my;
                  moved = false;
                  scrolling = false;
                  pending = null;
                  slider = null;
                  Mod wasListening = listening;
                  listening = null;
                  for (Cell c : cells) {
                      if (c.kind == K_CAT || c.kind == K_PANEL) continue;
                      if (!in(mx, my, c.x, c.y, c.w, c.h)) continue;
                      if (c.kind == K_SET && c.s instanceof Setting.Num n && mx < c.x + W - 30) {
                          slider = n;
                          sliderX = c.x;
                          n.setFraction((mx - c.x) / (double) (W - 30));
                          return true;
                      }
                      pending = actionFor(c, mx, wasListening);
                      return true;
                  }
                  scrolling = true;
                  return true;
              }

              @Override
              public boolean mouseDragged(double mx, double my, int button, double dx, double dy) {
                  if (slider != null) {
                      slider.setFraction((mx - sliderX) / (double) (W - 30));
                      return true;
                  }
                  if (!moved && (Math.abs(mx - pressX) > 4 || Math.abs(my - pressY) > 4)) {
                      moved = true;
                      scrolling = true;
                      pending = null;
                  }
                  if (scrolling) {
                      scrollX += (int) dx;
                      scrollY += (int) dy;
                      clampScroll();
                      return true;
                  }
                  return super.mouseDragged(mx, my, button, dx, dy);
              }

              @Override
              public boolean mouseReleased(double mx, double my, int button) {
                  if (pending != null && !moved) pending.run();
                  pending = null;
                  slider = null;
                  scrolling = false;
                  moved = false;
                  return true;
              }

              @Override
              public boolean mouseScrolled(double mx, double my, double amount) {
                  scrollY += (int) (amount * 20);
                  clampScroll();
                  return true;
              }

              @Override
              public boolean keyPressed(int key, int scan, int modifiers) {
                  if (listening != null) {
                      if (key == GLFW.GLFW_KEY_ESCAPE) {
                          listening = null;
                          return true;
                      }
                      if (key == GLFW.GLFW_KEY_BACKSPACE || key == GLFW.GLFW_KEY_DELETE) {
                          listening.bind = -1;
                      } else {
                          listening.bind = key;
                      }
                      listening = null;
                      return true;
                  }
                  if (key == HvhClient.guiKey) {
                      HvhClient.prev.put(key, true);
                      close();
                      return true;
                  }
                  return super.keyPressed(key, scan, modifiers);
              }

              @Override
              public void removed() {
                  HvhClient.save();
              }
          }
