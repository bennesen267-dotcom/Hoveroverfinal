              protected void init() {
                  makeField(32, "config name");
                  int bx = this.width / 2 - 140;
                  addDrawableChild(ButtonWidget.builder(Text.literal("Back"), b -> close())
                          .dimensions(bx, 44, 66, 18).build());
                  addDrawableChild(ButtonWidget.builder(Text.literal("Save"), b -> doSave())
                          .dimensions(bx + 71, 44, 66, 18).build());
                  addDrawableChild(ButtonWidget.builder(Text.literal("Load"), b -> doLoad())
                          .dimensions(bx + 142, 44, 66, 18).build());
                  addDrawableChild(ButtonWidget.builder(Text.literal("Delete"), b -> doDelete())
                          .dimensions(bx + 213, 44, 66, 18).build());
                  refresh();
              }

