                  String n = name();
                  if (n.isEmpty()) {
                      status = "Pick or type a config";
                      return;
                  }
                  status = Configs.load(n) ? "Loaded: " + n : "Not found: " + n;
              }

              private void doDelete() {
                  String n = name();
                  if (n.isEmpty()) {
                      status = "Pick or type a config";
                      return;
                  }
                  status = Configs.delete(n) ? "Deleted: " + n : "Not found: " + n;
                  refresh();
              }

