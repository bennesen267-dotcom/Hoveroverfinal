          package com.hvh;

          import java.util.LinkedHashSet;
          import java.util.Set;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.entity.Entity;
          import net.minecraft.entity.player.PlayerEntity;
          import net.minecraft.text.Text;
          import org.lwjgl.glfw.GLFW;

          public class Friends extends Mod {
              public static final Set<String> set = new LinkedHashSet<>();

              public final Setting.Bool ignore = add(new Setting.Bool("Ignore Friends", true));
              public final Setting.Bool middleClick = add(new Setting.Bool("Middle Click", true));
              public final Setting.Button menu = add(new Setting.Button("Friends Menu", () -> {
                  MinecraftClient mc = MinecraftClient.getInstance();
                  mc.setScreen(new FriendsScreen(mc.currentScreen));
              }));

              private boolean midPrev = false;

              public Friends() {
                  super("Friends", "Misc");
                  enabled = true;
                  listed = false;
              }

              public static boolean is(Entity e) {
                  return e instanceof PlayerEntity p && set.contains(p.getName().getString().toLowerCase());
              }

              public static boolean ignored(Entity e) {
                  Friends f = HvhClient.get(Friends.class);
                  return f != null && f.enabled && f.ignore.value && is(e);
              }

              @Override
              public void onTick(MinecraftClient mc) {
                  if (!middleClick.value || mc.player == null || mc.getWindow() == null) return;
                  boolean now = GLFW.glfwGetMouseButton(mc.getWindow().getHandle(), GLFW.GLFW_MOUSE_BUTTON_MIDDLE) == GLFW.GLFW_PRESS;
                  boolean edge = now && !midPrev;
                  midPrev = now;
                  if (!edge || mc.currentScreen != null) return;
                  if (mc.targetedEntity instanceof PlayerEntity p) {
                      String n = p.getName().getString().toLowerCase();
                      if (set.remove(n)) {
                          mc.player.sendMessage(Text.literal("Friend removed: " + n), true);
                      } else {
                          set.add(n);
                          mc.player.sendMessage(Text.literal("Friend added: " + n), true);
                      }
                      HvhClient.save();
                  }
              }
          }
