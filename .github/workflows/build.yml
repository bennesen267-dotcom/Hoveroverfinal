              public boolean keyPressed(int key, int scan, int modifiers) {
                  if (listening >= 0) {
                      if (key == GLFW.GLFW_KEY_ESCAPE) {
                          listening = -1;
                      } else if (listening < Macros.list.size()) {
                          Macros.list.get(listening).key = (key == GLFW.GLFW_KEY_BACKSPACE || key == GLFW.GLFW_KEY_DELETE) ? -1 : key;
                          listening = -1;
                          HvhClient.save();
                      } else {
                          listening = -1;
