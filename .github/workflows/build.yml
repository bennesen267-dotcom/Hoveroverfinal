                  ctx.fill(x, y, x + w, y + ROW - 2, 0xFF2A2A34);
                  ctx.fill(x, y, x + 72, y + ROW - 2, listening == idx ? 0xFF8B6B1E : 0xFF3A3A6A);
                  String k = listening == idx ? "press key..." : (m.key < 0 ? "No key" : HvhClient.keyName(m.key));
                  ctx.drawTextWithShadow(this.textRenderer, this.textRenderer.trimToWidth(k, 66), x + 4, y + 5, 0xFFFFFFFF);
