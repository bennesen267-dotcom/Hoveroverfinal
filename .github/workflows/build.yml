name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8

      - name: Dosyaları oluştur
        run: |
          mkdir -p src/main/java/com/hvh/mixin src/main/resources


          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'fabric-loom' version '1.6-SNAPSHOT'
          }
          version = '1.0.0'
          group = 'com.hvh'
          base { archivesName = 'HVH-Client' }
          loom {
              accessWidenerPath = file("src/main/resources/hvhclient.accesswidener")
          }
          dependencies {
              minecraft "com.mojang:minecraft:1.20.1"
              mappings "net.fabricmc:yarn:1.20.1+build.10:v2"
              modImplementation "net.fabricmc:fabric-loader:0.15.11"
              modImplementation "net.fabricmc.fabric-api:fabric-api:0.92.2+1.20.1"
          }
          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") { expand "version": project.version }
          }
          tasks.withType(JavaCompile).configureEach { it.options.release = 17 }
          java {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }
          EOF

          cat > src/main/resources/fabric.mod.json <<'EOF'
          {
            "schemaVersion": 1,
            "id": "hvhclient",
            "version": "${version}",
            "name": "HVH Client",
            "environment": "client",
            "entrypoints": { "client": ["com.hvh.HvhClient"] },
            "mixins": ["hvhclient.mixins.json"],
            "accessWidener": "hvhclient.accesswidener",
            "depends": {
              "fabricloader": ">=0.14.0",
              "minecraft": "1.20.1",
              "java": ">=17",
              "fabric-api": "*"
            }
          }
          EOF

          cat > src/main/resources/hvhclient.accesswidener <<'EOF'
          accessWidener v2 named
          accessible field net/minecraft/client/gui/screen/ingame/HandledScreen focusedSlot Lnet/minecraft/screen/slot/Slot;
          EOF

          cat > src/main/resources/hvhclient.mixins.json <<'EOF'
          {
            "required": true,
            "minVersion": "0.8",
            "package": "com.hvh.mixin",
            "compatibilityLevel": "JAVA_17",
            "client": ["HeldItemRendererMixin"],
            "injectors": { "defaultRequire": 1 }
          }
          EOF

          cat > src/main/java/com/hvh/Setting.java <<'EOF'
          package com.hvh;

          public abstract class Setting {
              public final String name;

              protected Setting(String name) {
                  this.name = name;
              }

              public static class Bool extends Setting {
                  public boolean value;

                  public Bool(String name, boolean def) {
                      super(name);
                      this.value = def;
                  }
              }

              public static class Num extends Setting {
                  public double value, min, max, step;
                  public boolean infiniteTop = false;

                  public Num(String name, double def, double min, double max, double step) {
                      super(name);
                      this.value = def;
                      this.min = min;
                      this.max = max;
                      this.step = step;
                  }

                  public Num infinite() {
                      infiniteTop = true;
                      return this;
                  }

                  public void change(int dir) {
                      double v = value + dir * step;
                      v = Math.round(v / step) * step;
                      value = Math.max(min, Math.min(max, v));
                  }

                  public double fraction() {
                      if (max <= min) return 0;
                      return Math.max(0, Math.min(1, (value - min) / (max - min)));
                  }

                  public void setFraction(double f) {
                      f = Math.max(0, Math.min(1, f));
                      double v = min + f * (max - min);
                      v = Math.round(v / step) * step;
                      value = Math.max(min, Math.min(max, v));
                  }
              }

              public static class Button extends Setting {
                  public final Runnable action;

                  public Button(String name, Runnable action) {
                      super(name);
                      this.action = action;
                  }
              }
          }
          EOF

          cat > src/main/java/com/hvh/Mod.java <<'EOF'
          package com.hvh;

          import java.util.ArrayList;
          import java.util.List;
          import net.fabricmc.fabric.api.client.rendering.v1.WorldRenderContext;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.gui.DrawContext;

          public abstract class Mod {
              public final String name;
              public final String category;
              public boolean enabled = false;
              public boolean toggleable = true;
              public boolean listed = true;
              public boolean expanded = true;
              public int bind = -1;
              public final List<Setting> settings = new ArrayList<>();

              protected Mod(String name, String category) {
                  this.name = name;
                  this.category = category;
              }

              protected <T extends Setting> T add(T s) {
                  settings.add(s);
                  return s;
              }

              public void toggle() {
                  enabled = !enabled;
              }

              public void onTick(MinecraftClient mc) {}

              public void onFrame(MinecraftClient mc, float dt) {}

              public void onRender(WorldRenderContext ctx) {}

              public void onHud(DrawContext ctx) {}
          }
          EOF

          cat > src/main/java/com/hvh/TriggerBot.java <<'EOF'
          package com.hvh;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.entity.Entity;
          import net.minecraft.entity.LivingEntity;
          import net.minecraft.entity.player.PlayerEntity;
          import net.minecraft.item.ItemStack;
          import net.minecraft.item.Items;
          import net.minecraft.network.packet.c2s.play.UpdateSelectedSlotC2SPacket;
          import net.minecraft.util.Hand;
          import net.minecraft.util.hit.EntityHitResult;
          import net.minecraft.util.hit.HitResult;

          public class TriggerBot extends Mod {
              public final Setting.Bool serverCooldown = add(new Setting.Bool("Server Cooldown", true));
              public final Setting.Num minCooldown = add(new Setting.Num("Cooldown %", 100, 50, 100, 5));
              public final Setting.Num delay = add(new Setting.Num("Delay (tick)", 10, 0, 20, 1));
              public final Setting.Bool onlyPlayers = add(new Setting.Bool("Only Players", true));
              public final Setting.Bool onlyWeapons = add(new Setting.Bool("Only Weapons", true));
              public final Setting.Bool preHit = add(new Setting.Bool("PreHit (Rocket)", false));
              public final Setting.Button weaponsMenu = add(new Setting.Button("Weapons Menu", () -> {
                  MinecraftClient mc = MinecraftClient.getInstance();
                  mc.setScreen(new WeaponsScreen(mc.currentScreen));
              }));

              private int ticks = 0;

              public TriggerBot() {
                  super("TriggerBot", "Combat");
              }

              @Override
              public void onTick(MinecraftClient mc) {
                  ticks++;
                  if (mc.player == null || mc.world == null || mc.interactionManager == null) return;
                  if (mc.currentScreen != null) return;

                  HitResult hr = mc.crosshairTarget;
                  if (!(hr instanceof EntityHitResult)) return;
                  Entity e = ((EntityHitResult) hr).getEntity();
                  if (!(e instanceof LivingEntity) || !e.isAlive() || e == mc.player) return;
                  if (onlyPlayers.value && !(e instanceof PlayerEntity)) return;
                  if (e instanceof PlayerEntity pe && pe.isSpectator()) return;
                  if (Friends.ignored(e)) return;

                  ItemStack held = mc.player.getMainHandStack();
                  boolean pre = preHit.value && held.isOf(Items.FIREWORK_ROCKET);

                  if (!pre && onlyWeapons.value && !HvhClient.weapons.contains(held.getItem())) return;
                  if (mc.player.isUsingItem()) return;

                  if (!pre) {
                      if (serverCooldown.value) {
                          if (mc.player.getAttackCooldownProgress(0.5f) < minCooldown.value / 100.0) return;
                      } else if (ticks < (int) delay.value) {
                          return;
                      }
                  }

                  mc.interactionManager.attackEntity(mc.player, e);
                  mc.player.swingHand(Hand.MAIN_HAND);
                  ticks = 0;

                  if (pre) switchToWeapon(mc);
              }

              private void switchToWeapon(MinecraftClient mc) {
                  if (mc.player == null || mc.getNetworkHandler() == null) return;
                  for (int i = 0; i < 9; i++) {
                      ItemStack s = mc.player.getInventory().getStack(i);
                      if (!s.isEmpty() && HvhClient.weapons.contains(s.getItem())) {
                          if (mc.player.getInventory().selectedSlot != i) {
                              mc.player.getInventory().selectedSlot = i;
                              mc.getNetworkHandler().sendPacket(new UpdateSelectedSlotC2SPacket(i));
                          }
                          return;
                      }
                  }
              }
          }
          EOF

          cat > src/main/java/com/hvh/AimAssist.java <<'EOF'
          package com.hvh;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.network.ClientPlayerEntity;
          import net.minecraft.entity.player.PlayerEntity;
          import net.minecraft.util.math.MathHelper;
          import net.minecraft.util.math.Vec3d;

          public class AimAssist extends Mod {
              public final Setting.Num range = add(new Setting.Num("Range", 5.0, 1, 8.5, 0.5).infinite());
              public final Setting.Num fov = add(new Setting.Num("FOV", 90, 10, 360, 10));
              public final Setting.Num speed = add(new Setting.Num("Speed", 5, 1, 20, 1));
              public final Setting.Bool vertical = add(new Setting.Bool("Vertical", true));
              public final Setting.Bool onlyClick = add(new Setting.Bool("Only On Click", true));

              public AimAssist() {
                  super("AimAssist", "Combat");
              }

              @Override
              public void onFrame(MinecraftClient mc, float dt) {
                  ClientPlayerEntity p = mc.player;
                  if (p == null || mc.world == null || mc.currentScreen != null) return;
                  if (onlyClick.value && !mc.options.attackKey.isPressed()) return;

                  boolean inf = range.value >= range.max;
                  Vec3d eye = p.getEyePos();
                  double bestAngle = fov.value / 2.0;
                  float[] best = null;

                  for (PlayerEntity t : mc.world.getPlayers()) {
                      if (t == p || !t.isAlive() || t.isSpectator()) continue;
                      if (Friends.ignored(t)) continue;
                      if (!inf && p.distanceTo(t) > range.value) continue;

                      Vec3d aim = t.getBoundingBox().getCenter();
                      double dx = aim.x - eye.x;
                      double dy = aim.y - eye.y;
                      double dz = aim.z - eye.z;
                      float yaw = (float) (Math.toDegrees(Math.atan2(dz, dx)) - 90.0);
                      float pitch = (float) -Math.toDegrees(Math.atan2(dy, Math.sqrt(dx * dx + dz * dz)));
                      float dyaw = MathHelper.wrapDegrees(yaw - p.getYaw());
                      float dpitch = pitch - p.getPitch();
                      double ang = Math.sqrt(dyaw * dyaw + dpitch * dpitch);
                      if (ang <= bestAngle) {
                          bestAngle = ang;
                          best = new float[] { dyaw, dpitch };
                      }
                  }
                  if (best == null) return;

                  float k = (float) Math.min(1.0, speed.value * dt);
                  p.setYaw(p.getYaw() + best[0] * k);
                  if (vertical.value) {
                      p.setPitch(MathHelper.clamp(p.getPitch() + best[1] * k, -90f, 90f));
                  }
              }
          }
          EOF

          cat > src/main/java/com/hvh/HoverTotem.java <<'EOF'
          package com.hvh;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.gui.screen.ingame.HandledScreen;
          import net.minecraft.item.Items;
          import net.minecraft.screen.slot.Slot;
          import net.minecraft.screen.slot.SlotActionType;

          public class HoverTotem extends Mod {
              public final Setting.Num delay = add(new Setting.Num("Delay (tick)", 0, 0, 10, 1));
              public final Setting.Num target = add(new Setting.Num("Slot (0=Offhand)", 0, 0, 9, 1));

              private int wait = 0;

              public HoverTotem() {
                  super("HoverTotem", "Combat");
              }

              @Override
              public void onTick(MinecraftClient mc) {
                  if (mc.player == null || mc.interactionManager == null) return;
                  if (!(mc.currentScreen instanceof HandledScreen<?> hs)) {
                      wait = 0;
                      return;
                  }
                  Slot slot = hs.focusedSlot;
                  if (slot == null || slot.inventory != mc.player.getInventory()) return;
                  int idx = slot.getIndex();
                  if (idx >= 36) return;
                  if (!slot.getStack().isOf(Items.TOTEM_OF_UNDYING)) {
                      wait = 0;
                      return;
                  }

                  int t = (int) target.value;
                  if (t == 0) {
                      if (mc.player.getOffHandStack().isOf(Items.TOTEM_OF_UNDYING)) return;
                  } else {
                      if (idx == t - 1) return;
                      if (mc.player.getInventory().getStack(t - 1).isOf(Items.TOTEM_OF_UNDYING)) return;
                  }

                  if (wait < (int) delay.value) {
                      wait++;
                      return;
                  }
                  wait = 0;

                  int button = t == 0 ? 40 : t - 1;
                  mc.interactionManager.clickSlot(hs.getScreenHandler().syncId, slot.id, button, SlotActionType.SWAP, mc.player);
              }
          }
          EOF

          cat > src/main/java/com/hvh/Nametags.java <<'EOF'
          package com.hvh;

          import net.fabricmc.fabric.api.client.rendering.v1.WorldRenderContext;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.font.TextRenderer;
          import net.minecraft.client.render.Camera;
          import net.minecraft.client.render.VertexConsumerProvider;
          import net.minecraft.client.util.math.MatrixStack;
          import net.minecraft.entity.player.PlayerEntity;
          import net.minecraft.text.Style;
          import net.minecraft.text.Text;
          import net.minecraft.util.math.MathHelper;
          import net.minecraft.util.math.Vec3d;

          public class Nametags extends Mod {
              public final Setting.Bool health = add(new Setting.Bool("Health", true));
              public final Setting.Bool self = add(new Setting.Bool("Self", false));
              public final Setting.Num scale = add(new Setting.Num("Scale", 1.0, 0.5, 3.0, 0.25));

              public Nametags() {
                  super("Nametags", "Render");
              }

              @Override
              public void onRender(WorldRenderContext ctx) {
                  MinecraftClient mc = MinecraftClient.getInstance();
                  if (mc.world == null || mc.player == null) return;

                  Camera cam = ctx.camera();
                  Vec3d cp = cam.getPos();
                  MatrixStack ms = ctx.matrixStack();
                  TextRenderer tr = mc.textRenderer;
                  VertexConsumerProvider.Immediate vc = mc.getBufferBuilders().getEntityVertexConsumers();
                  float td = ctx.tickDelta();

                  for (PlayerEntity pl : mc.world.getPlayers()) {
                      if (pl == mc.player && !self.value) continue;
                      if (!pl.isAlive() || pl.isSpectator()) continue;

                      double x = MathHelper.lerp(td, pl.prevX, pl.getX()) - cp.x;
                      double y = MathHelper.lerp(td, pl.prevY, pl.getY()) - cp.y + pl.getHeight() + 0.5;
                      double z = MathHelper.lerp(td, pl.prevZ, pl.getZ()) - cp.z;
                      double dist = Math.sqrt(x * x + y * y + z * z);

                      Text base = Friends.is(pl)
                              ? Text.literal(pl.getName().getString()).setStyle(Style.EMPTY.withColor(0x55FF55))
                              : pl.getName();
                      Text text = base;
                      if (health.value) {
                          float hp = pl.getHealth() + pl.getAbsorptionAmount();
                          float ratio = hp / pl.getMaxHealth();
                          int col = ratio > 0.66f ? 0x55FF55 : ratio > 0.33f ? 0xFFFF55 : 0xFF5555;
                          text = Text.literal("").append(base)
                                  .append(Text.literal(String.format(" %.1f", hp)).setStyle(Style.EMPTY.withColor(col)));
                      }

                      float s = (float) (0.025 * scale.value * Math.max(1.0, dist / 6.0));
                      ms.push();
                      ms.translate(x, y, z);
                      ms.multiply(cam.getRotation());
                      ms.scale(-s, -s, s);
                      float w = tr.getWidth(text);
                      tr.draw(text, -w / 2f, 0, 0xFFFFFFFF, false, ms.peek().getPositionMatrix(), vc,
                              TextRenderer.TextLayerType.SEE_THROUGH, 0x66000000, 0xF000F0);
                      vc.draw();
                      ms.pop();
                  }
              }
          }
          EOF

          cat > src/main/java/com/hvh/Hud.java <<'EOF'
          package com.hvh;

          import java.util.ArrayList;
          import java.util.List;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.font.TextRenderer;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.util.math.MatrixStack;
          import net.minecraft.entity.LivingEntity;
          import net.minecraft.util.math.MathHelper;

          public class Hud extends Mod {
              public final Setting.Bool watermark = add(new Setting.Bool("Watermark", true));
              public final Setting.Num wmScale = add(new Setting.Num("WM Scale", 1.0, 0.5, 3.0, 0.1));
              public final Setting.Num wmX = add(new Setting.Num("WM X %", 1, 0, 100, 1));
              public final Setting.Num wmY = add(new Setting.Num("WM Y %", 1, 0, 100, 1));

              public final Setting.Bool modList = add(new Setting.Bool("Module List", true));
              public final Setting.Num listScale = add(new Setting.Num("List Scale", 1.0, 0.5, 3.0, 0.1));
              public final Setting.Num listX = add(new Setting.Num("List X %", 1, 0, 100, 1));
              public final Setting.Num listY = add(new Setting.Num("List Y %", 6, 0, 100, 1));

              public final Setting.Bool targetHud = add(new Setting.Bool("TargetHUD", true));
              public final Setting.Num tScale = add(new Setting.Num("Target Scale", 1.0, 0.5, 3.0, 0.1));
              public final Setting.Num tX = add(new Setting.Num("Target X %", 50, 0, 100, 1));
              public final Setting.Num tY = add(new Setting.Num("Target Y %", 60, 0, 100, 1));

              private LivingEntity lastTarget = null;
              private long lastTime = 0;

              public Hud() {
                  super("HUD", "Render");
                  enabled = true;
                  listed = false;
              }

              private void place(DrawContext ctx, double xp, double yp, double scale, int w, int h, Runnable draw) {
                  float s = (float) scale;
                  int sw = ctx.getScaledWindowWidth();
                  int sh = ctx.getScaledWindowHeight();
                  float x = Math.max(0f, (sw - w * s) * (float) xp / 100f);
                  float y = Math.max(0f, (sh - h * s) * (float) yp / 100f);
                  MatrixStack ms = ctx.getMatrices();
                  ms.push();
                  ms.translate(x, y, 0);
                  ms.scale(s, s, 1f);
                  draw.run();
                  ms.pop();
              }

              @Override
              public void onHud(DrawContext ctx) {
                  MinecraftClient mc = MinecraftClient.getInstance();
                  TextRenderer tr = mc.textRenderer;

                  if (watermark.value) {
                      final String t = "HVH Client";
                      place(ctx, wmX.value, wmY.value, wmScale.value, tr.getWidth(t), 9,
                              () -> ctx.drawTextWithShadow(tr, t, 0, 0, 0xFF55FFFF));
                  }

                  if (modList.value) {
                      final List<String> names = new ArrayList<>();
                      int w = 0;
                      for (Mod m : HvhClient.mods) {
                          if (m.enabled && m.listed) {
                              names.add(m.name);
                              w = Math.max(w, tr.getWidth(m.name));
                          }
                      }
                      if (!names.isEmpty()) {
                          place(ctx, listX.value, listY.value, listScale.value, w, names.size() * 10, () -> {
                              int y = 0;
                              for (String n : names) {
                                  ctx.drawTextWithShadow(tr, n, 0, y, 0xFF55FF55);
                                  y += 10;
                              }
                          });
                      }
                  }

                  if (targetHud.value) drawTarget(ctx, mc, tr);
              }

              private void drawTarget(DrawContext ctx, MinecraftClient mc, TextRenderer tr) {
                  if (mc.player == null) return;
                  LivingEntity t = null;
                  long now = System.currentTimeMillis();
                  if (mc.targetedEntity instanceof LivingEntity le && le.isAlive()) {
                      t = le;
                      lastTarget = le;
                      lastTime = now;
                  } else if (lastTarget != null && lastTarget.isAlive() && !lastTarget.isRemoved() && now - lastTime < 2000) {
                      t = lastTarget;
                  }
                  if (t == null && mc.currentScreen instanceof ClickGui) t = mc.player;
                  if (t == null) return;

                  final LivingEntity tt = t;
                  float hp = tt.getHealth() + tt.getAbsorptionAmount();
                  float max = Math.max(1f, tt.getMaxHealth());
                  final float ratio = MathHelper.clamp(hp / max, 0f, 1f);
                  final int col = ratio > 0.66f ? 0xFF55FF55 : ratio > 0.33f ? 0xFFFFFF55 : 0xFFFF5555;
                  final String name = tt.getName().getString();
                  final String info = String.format("%.1f HP  %.1fm", hp, mc.player.distanceTo(tt));

                  place(ctx, tX.value, tY.value, tScale.value, 120, 34, () -> {
                      ctx.fill(0, 0, 120, 34, 0xAA101018);
                      ctx.drawTextWithShadow(tr, tr.trimToWidth(name, 112), 4, 4, 0xFFFFFFFF);
                      ctx.drawTextWithShadow(tr, info, 4, 15, 0xFFAAAAAA);
                      ctx.fill(4, 26, 116, 30, 0xFF333333);
                      ctx.fill(4, 26, 4 + (int) (112 * ratio), 30, col);
                  });
              }
          }
          EOF

          cat > src/main/java/com/hvh/ViewModel.java <<'EOF'
          package com.hvh;

          import net.minecraft.client.util.math.MatrixStack;
          import net.minecraft.util.Hand;
          import net.minecraft.util.math.RotationAxis;

          public class ViewModel extends Mod {
              public final Setting.Bool mainOnly = add(new Setting.Bool("Main Hand Only", false));
              public final Setting.Num x = add(new Setting.Num("X", 0, -2, 2, 0.05));
              public final Setting.Num y = add(new Setting.Num("Y", 0, -2, 2, 0.05));
              public final Setting.Num z = add(new Setting.Num("Z", 0, -2, 2, 0.05));
              public final Setting.Num scale = add(new Setting.Num("Scale", 1.0, 0.1, 2.0, 0.05));
              public final Setting.Num rx = add(new Setting.Num("Rotate X", 0, -180, 180, 5));
              public final Setting.Num ry = add(new Setting.Num("Rotate Y", 0, -180, 180, 5));
              public final Setting.Num rz = add(new Setting.Num("Rotate Z", 0, -180, 180, 5));

              public ViewModel() {
                  super("ViewModel", "Render");
              }

              public void apply(MatrixStack m, Hand hand) {
                  if (mainOnly.value && hand != Hand.MAIN_HAND) return;
                  float side = hand == Hand.OFF_HAND ? -1f : 1f;
                  m.translate(x.value * side, y.value, z.value);
                  float s = (float) scale.value;
                  m.scale(s, s, s);
                  m.multiply(RotationAxis.POSITIVE_X.rotationDegrees((float) rx.value));
                  m.multiply(RotationAxis.POSITIVE_Y.rotationDegrees((float) ry.value * side));
                  m.multiply(RotationAxis.POSITIVE_Z.rotationDegrees((float) rz.value * side));
              }
          }
          EOF

          cat > src/main/java/com/hvh/Macros.java <<'EOF'
          package com.hvh;

          import java.util.ArrayList;
          import java.util.List;
          import net.minecraft.client.MinecraftClient;

          public class Macros extends Mod {
              public static class Macro {
                  public String cmd;
                  public int key;

                  public Macro(String cmd, int key) {
                      this.cmd = cmd;
                      this.key = key;
                  }
              }

              public static final List<Macro> list = new ArrayList<>();

              public final Setting.Button menu = add(new Setting.Button("Macro Menu", () -> {
                  MinecraftClient mc = MinecraftClient.getInstance();
                  mc.setScreen(new MacroScreen(mc.currentScreen));
              }));

              public Macros() {
                  super("Macros", "Misc");
                  enabled = true;
                  listed = false;
              }

              @Override
              public void onTick(MinecraftClient mc) {
                  if (mc.getWindow() == null) return;
                  long w = mc.getWindow().getHandle();
                  for (Macro m : list) {
                      boolean e = HvhClient.edge(w, m.key);
                      if (e && mc.currentScreen == null && mc.player != null) run(mc, m.cmd);
                  }
              }

              public static void run(MinecraftClient mc, String c) {
                  if (mc.getNetworkHandler() == null || c == null) return;
                  c = c.trim();
                  if (c.isEmpty()) return;
                  if (c.startsWith("/")) {
                      mc.getNetworkHandler().sendChatCommand(c.substring(1));
                  } else {
                      mc.getNetworkHandler().sendChatMessage(c);
                  }
              }
          }
