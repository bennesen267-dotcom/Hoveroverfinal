          package com.hvh;

          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.client.gui.widget.TextFieldWidget;
          import net.minecraft.text.Text;

          public abstract class ListScreen extends Screen {
              protected static final int ROW = 20;
              protected final Screen parent;
              protected TextFieldWidget field;
              protected int scroll = 0;

              private boolean pressed = false;
              private boolean dragged = false;
              private int pressIdx = -1;
              private double dragAcc = 0;
              private double pressX = 0;

              protected ListScreen(String title, Screen parent) {
                  super(Text.literal(title));
                  this.parent = parent;
              }

              protected abstract int count();

              protected abstract void drawRow(DrawContext ctx, int idx, int x, int y, int w);

              protected abstract void tapRow(int idx, double mx, int rowX);

              protected void makeField(int maxLen, String hint) {
                  field = new TextFieldWidget(this.textRenderer, this.width / 2 - 100, 22, 200, 18, Text.literal(""));
                  field.setMaxLength(maxLen);
                  field.setSuggestion(hint);
                  field.setChangedListener(s -> field.setSuggestion(s.isEmpty() ? hint : ""));
                  addDrawableChild(field);
              }

              protected int listTop() {
                  return 68;
              }

              protected int listX() {
                  return this.width / 2 - 140;
              }

              protected int listW() {
                  return 280;
              }

              protected int visibleRows() {
                  return Math.max(1, (this.height - 6 - listTop()) / ROW);
              }

              protected void clampScroll() {
                  int max = Math.max(0, count() - visibleRows());
                  if (scroll > max) scroll = max;
                  if (scroll < 0) scroll = 0;
              }

              protected void scrollToEnd() {
                  scroll = Math.max(0, count() - visibleRows());
              }

              protected void drawList(DrawContext ctx) {
                  clampScroll();
                  int top = listTop();
                  int rows = visibleRows();
                  for (int i = 0; i < rows; i++) {
                      int idx = scroll + i;
                      if (idx >= count()) break;
                      drawRow(ctx, idx, listX(), top + i * ROW, listW());
                  }
              }

              private boolean inList(double mx, double my) {
                  int x = listX();
                  return mx >= x && mx < x + listW() && my >= listTop();
              }

              @Override
              public boolean mouseClicked(double mx, double my, int button) {
                  if (super.mouseClicked(mx, my, button)) return true;
                  if (inList(mx, my)) {
                      int row = (int) ((my - listTop()) / ROW);
                      if (row < visibleRows()) {
                          pressed = true;
                          dragged = false;
                          dragAcc = 0;
                          pressX = mx;
                          pressIdx = row + scroll;
                          return true;
                      }
                  }
                  return false;
              }

              @Override
              public boolean mouseDragged(double mx, double my, int button, double dx, double dy) {
                  if (pressed) {
                      if (Math.abs(dy) > 0) dragged = true;
                      dragAcc += dy;
                      while (dragAcc <= -ROW) {
                          scroll++;
                          dragAcc += ROW;
                      }
                      while (dragAcc >= ROW) {
                          scroll--;
                          dragAcc -= ROW;
                      }
                      clampScroll();
                      return true;
                  }
                  return super.mouseDragged(mx, my, button, dx, dy);
              }

              @Override
              public boolean mouseReleased(double mx, double my, int button) {
                  if (pressed) {
                      pressed = false;
                      if (!dragged && pressIdx >= 0 && pressIdx < count()) {
                          tapRow(pressIdx, pressX, listX());
                      }
                      return true;
                  }
                  return super.mouseReleased(mx, my, button);
              }

              @Override
              public boolean mouseScrolled(double mx, double my, double amount) {
                  scroll -= (int) Math.signum(amount) * 3;
                  clampScroll();
                  return true;
              }

              @Override
              public void close() {
                  this.client.setScreen(parent);
              }

              @Override
              public void removed() {
                  HvhClient.save();
              }
          }
