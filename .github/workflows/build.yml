          package com.hvh;

          import java.io.InputStream;
          import java.io.OutputStream;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Properties;
          import java.util.stream.Collectors;
          import java.util.stream.Stream;
          import net.fabricmc.loader.api.FabricLoader;

          public class Configs {
              public static Path dir() {
                  Path d = FabricLoader.getInstance().getConfigDir().resolve("hvhclient").resolve("configs");
                  try {
                      Files.createDirectories(d);
                  } catch (Exception ignored) {
                  }
                  return d;
              }

              public static String clean(String n) {
                  if (n == null) return "";
                  n = n.trim().replaceAll("[^A-Za-z0-9_\\-]", "_");
                  if (n.length() > 32) n = n.substring(0, 32);
                  return n;
              }

              public static List<String> list() {
                  try (Stream<Path> s = Files.list(dir())) {
                      return s.map(p -> p.getFileName().toString())
                              .filter(f -> f.endsWith(".properties"))
                              .map(f -> f.substring(0, f.length() - 11))
                              .sorted()
                              .collect(Collectors.toList());
                  } catch (Exception e) {
                      return new ArrayList<>();
                  }
              }

              public static boolean save(String name) {
                  try (OutputStream o = Files.newOutputStream(dir().resolve(name + ".properties"))) {
                      HvhClient.buildProps().store(o, "HVH Client config: " + name);
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }

              public static boolean load(String name) {
                  Path f = dir().resolve(name + ".properties");
                  if (!Files.exists(f)) return false;
                  try (InputStream in = Files.newInputStream(f)) {
                      Properties p = new Properties();
                      p.load(in);
                      HvhClient.applyProps(p);
                      HvhClient.save();
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }

              public static boolean delete(String name) {
                  try {
                      return Files.deleteIfExists(dir().resolve(name + ".properties"));
                  } catch (Exception e) {
                      return false;
                  }
              }
          }
